version: "2"
sql:
  - engine: "mysql"
    queries:
      - user.sql
      - file.sql
      - exif.sql
      - media.sql
      - device.sql
      - logic_file.sql
      - livp.sql
      - sync_from.sql
    schema: "schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "./"
        emit_json_tags: true
        emit_empty_slices: true
