version: "2"
sql:
  - engine: "mysql"
    queries:
      - user.sql
      - file.sql
      - exif.sql
      - media.sql
      - device.sql
      - logic_file.sql
      - livp.sql
      - sync_from.sql
    schema: "schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "./"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          # NullInt64
          - db_type: "bigint"
            nullable: true
            go_type: "github.com/lazyxu/kfs/dao.NullInt64"
            go_struct_tag: 'json:",omitempty"'
          # NullBool
          - db_type: "tinyint"
            nullable: true
            go_type: "github.com/lazyxu/kfs/dao.NullBool"
            go_struct_tag: 'json:",omitempty"'
          # NullFloat64
          - db_type: "double"
            nullable: true
            go_type: "github.com/lazyxu/kfs/dao.NullFloat64"
            go_struct_tag: 'json:",omitempty"'
          # NullTime
          - db_type: "datetime"
            nullable: true
            go_type: "github.com/lazyxu/kfs/dao.NullTime"
            go_struct_tag: 'json:",omitempty"'
          # NullString
          - db_type: "text"
            nullable: true
            go_type: "github.com/lazyxu/kfs/dao.NullString"
            go_struct_tag: 'json:",omitempty"'
          - db_type: "char"
            nullable: true
            go_type: "github.com/lazyxu/kfs/dao.NullString"
            go_struct_tag: 'json:",omitempty"'
          - db_type: "varchar"
            nullable: true
            go_type: "github.com/lazyxu/kfs/dao.NullString"
            go_struct_tag: 'json:",omitempty"'
        # overrides:
        #   - column: "_sync_from_baidu_photo.BDUSS_BFESS"
        #     go_type: "int64"
        #     go_struct_tag: "json:\"BDUSS_BFESS\""
        #   - column: "_sync_from_baidu_photo.STOKEN"
        #     go_type: "string"
        #     go_struct_tag: "json:\"STOKEN\""
